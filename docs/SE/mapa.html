    const dv = x2[I.m] - x1[I.m], p = D.polos[c.d2];
    return s + `Margem 1º turno: ${fmt(x1[I.m])} p.p.<br>Margem 2º turno: ${fmt(x2[I.m])} p.p.` +
      `<br><b>Variação: ${dv > 0 ? "+" : ""}${fmt(dv)} p.p.</b> (a favor de ${dv > 0 ? p[0] : p[1]})`;
  }
  const x = val(v, c.d);
  return s + (x ? linhaDisputa(c.d, x) : "sem dados");
}

// --- camadas geográficas ---
const geo = L.geoJSON(D.geo, {
  style: f => ({fillColor: cor(D.valores.unidade[f.properties.id]), fillOpacity: 0.85,
                color: "#ffffff", weight: D.borda || 0.8}),
  onEachFeature: (f, l) => {
    l.bindTooltip(() => info(f.properties.nome, D.valores.unidade[f.properties.id]), {sticky: true});
    l.on("mouseover", () => l.setStyle({weight: 2.5, color: "#1d1f22"}));
    l.on("mouseout", () => l.setStyle({weight: D.borda || 0.8, color: "#ffffff"}));
  }
});
const contorno = L.geoJSON(D.geo, {style: {fill: false, color: "#8a8985", weight: 0.6}, interactive: false});
const pontos = L.layerGroup(D.pontos.map(p => {
  const [lat, lon, id, nome, onde] = p;
  const v = D.valores.local[id];
  const comp = v ? Math.max(...Object.values(v).map(x => x[I.comp])) : 0;
  const m = L.circleMarker([lat, lon], {radius: Math.max(2.5, Math.sqrt(comp) / D.raio),
    color: "#ffffff", weight: 0.6, fillOpacity: 0.9});
  m._v = v;
  m.bindTooltip(() => info(`${nome}<br><span style="font-weight:400;color:#52514e">${onde}</span>`, m._v),
                {sticky: true});
  return m;
}));

function redesenhar() {
  if (visao === "unidade") {
    geo.setStyle(f => ({fillColor: cor(D.valores.unidade[f.properties.id])}));
  } else {
    pontos.eachLayer(m => m.setStyle({fillColor: cor(m._v)}));
  }
  legenda.update();
}
function trocarVisao(v) {
  visao = v;
  if (v === "unidade") { mapa.removeLayer(pontos); mapa.removeLayer(contorno); geo.addTo(mapa); }
  else { mapa.removeLayer(geo); contorno.addTo(mapa); pontos.addTo(mapa); }
  redesenhar();
}

// --- controles ---
const painel = L.control({position: "topright"});
painel.onAdd = () => {
  const div = L.DomUtil.create("div", "painel");
  let h = "<h4>Disputa</h4>";
  for (const c of D.camadas)
    h += `<label><input type="radio" name="c" value="${c.id}" ${c === camada ? "checked" : ""}> ${c.rotulo}</label>`;
  if (D.pontos.length) {
    h += "<h4>Recorte</h4>";
    h += `<label><input type="radio" name="v" value="unidade" checked> ${D.nome_unidade}</label>`;
    h += `<label><input type="radio" name="v" value="local"> Locais de votação</label>`;
  }
  div.innerHTML = h;
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);
  div.addEventListener("change", e => {
    if (e.target.name === "c") { camada = D.camadas.find(c => c.id === e.target.value); redesenhar(); }
    if (e.target.name === "v") trocarVisao(e.target.value);
  });
  return div;
};
painel.addTo(mapa);

const legenda = L.control({position: "bottomleft"});
legenda.onAdd = () => (legenda._div = L.DomUtil.create("div", "legenda"));
legenda.update = () => {
  const c = camada;
  let h = "";
  if (c.tipo === "margem" || c.tipo === "virada") {
    const e = D.escalas[c.esc], k = c.tipo === "virada" ? 0.5 : 1, p = D.polos[c.d || c.d2];
    h = `<div class="t">${c.tipo === "virada" ? "Variação da margem entre turnos (p.p.)" : "Margem nos votos válidos (p.p.)"}</div>`;
    h += `<div class="barra">${[...e.b, NEUTRO, ...e.a].map(x => `<span style="background:${x}"></span>`).join("")}</div>`;
    h += `<div class="rot"><span>${p[1]} +${40 * k}</span><span>0</span><span>${p[0]} +${40 * k}</span></div>`;
  } else if (c.tipo === "vencedor") {
    h = `<div class="t">Mais votado</div>` + Object.entries(c.legenda)
      .map(([n, nome]) => `<div class="cat"><i style="background:${c.cores[n] || "#b5b4ae"}"></i>${nome}</div>`).join("");
  } else {
    const e = D.escalas.abst;
    h = `<div class="t">Abstenção (%)</div><div class="barra">${e.cores.map(x => `<span style="background:${x}"></span>`).join("")}</div>`;
    h += `<div class="rot"><span>${fmt(e.min, 0)}%</span><span>${fmt(e.max, 0)}%</span></div>`;
  }
  if (visao === "local") h += `<div class="rot" style="margin-top:6px">Círculo ∝ comparecimento</div>`;
  legenda._div.innerHTML = h;
};
legenda.addTo(mapa);

geo.addTo(mapa);
mapa.fitBounds(geo.getBounds(), {padding: [10, 10]});
redesenhar();
</script></body></html>
