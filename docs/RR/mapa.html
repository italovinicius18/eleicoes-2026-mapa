-96.6,13,98.3,176,13.7,0.0]},"3158-4-1163":{"G1":[65.7,33.6,32.1,22,65.7,1335,14.3,3.6],"P1":[77.7,17.3,60.4,22,77.7,1335,14.3,2.0],"P2":[78.0,22.0,56.0,22,78.0,1113,28.6,1.3]},"3158-4-1180":{"G1":[61.2,38.8,22.3,22,61.2,106,17.2,2.8],"P1":[71.0,21.0,50.0,22,71.0,106,17.2,5.7],"P2":[72.1,27.9,44.1,22,72.1,70,45.3,2.9]},"3158-4-1201":{"G1":[69.2,30.4,38.7,22,69.2,755,17.7,4.2],"P1":[69.8,25.3,44.5,22,69.8,755,17.7,2.6],"P2":[71.6,28.4,43.1,22,71.6,573,37.5,1.2]},"3158-4-1244":{"G1":[64.9,34.7,30.2,22,64.9,242,16.8,8.3],"P1":[75.2,21.8,53.4,22,75.2,242,16.8,3.3],"P2":[74.6,25.4,49.2,22,74.6,200,31.3,3.5]}}},"camadas":[{"id":"P1","rotulo":"Presidente, 1º turno","tipo":"margem","d":"P1","esc":"pres"},{"id":"P2","rotulo":"Presidente, 2º turno","tipo":"margem","d":"P2","esc":"pres"},{"id":"G1","rotulo":"Governador, 1º turno","tipo":"margem","d":"G1","esc":"gov"},{"id":"VP","rotulo":"Virada entre turnos, Presidente","tipo":"virada","d1":"P1","d2":"P2","esc":"pres"},{"id":"WP","rotulo":"Mais votado no 1º turno, Presidente","tipo":"vencedor","d":"P1","cores":{"22":"#2a78d6","13":"#e34948","70":"#eda100","14":"#e87ba4","55":"#6250d6","30":"#008300","80":"#8a5a00","27":"#5598e7","16":"#b5b4ae","21":"#b5b4ae","35":"#b5b4ae","29":"#b5b4ae","28":"#b5b4ae"},"legenda":{"22":"Flavio Bolsonaro (PL)","13":"Lula (PT)"}},{"id":"WG","rotulo":"Mais votado no 1º turno, Governador","tipo":"vencedor","d":"G1","cores":{"22":"#1baf7a","10":"#eb6834","50":"#eda100","77":"#e87ba4","29":"#6250d6"},"legenda":{"22":"Arthur Henrique (PL)","10":"Soldado Sampaio (REPUBLICANOS)"}},{"id":"AB","rotulo":"Abstenção no 2º turno","tipo":"abstencao","d":"P2"}],"inicial":"P2","polos":{"P1":["Flavio Bolsonaro (PL)","Lula (PT)"],"P2":["Flavio Bolsonaro (PL)","Lula (PT)"],"G1":["Arthur Henrique (PL)","Soldado Sampaio (REPUBLICANOS)"]},"nomes":{"P1":{"22":"Flavio Bolsonaro (PL)","29":"Rui Costa Pimenta (PCO)","13":"Lula (PT)","14":"Renan Santos (MISSÃO)","16":"Hertz Dias (PSTU)","21":"Edmilson Costa (PCB)","27":"Clariana Barao (DC)","28":"Leonardo Avalanche (PRTB)","30":"Zema (NOVO)","35":"Veterinário Wilson Grassi (DEMOCRATA)","55":"Ronaldo Caiado (PSD)","70":"Escritor Augusto Cury (AVANTE)","80":"Samara (UP)"},"P2":{"22":"Flavio Bolsonaro (PL)","13":"Lula (PT)"},"G1":{"10":"Soldado Sampaio (REPUBLICANOS)","22":"Arthur Henrique (PL)","29":"Clébio Genuíno (PCO)","50":"Rosi Aires (PSOL)","77":"Farah Mesquita (SOLIDARIEDADE)"}},"raio":3.9679841178089,"escalas":{"pres":{"a":["#cde2fb","#86b6ef","#2a78d6","#1c5cab","#0d366b"],"b":["#7a1c1c","#b8302f","#e34948","#f19e9a","#fbd0cd"]},"gov":{"a":["#d3f2e6","#8edcbf","#1baf7a","#13805a","#0b5139"],"b":["#7a2c0c","#b8461c","#eb6834","#f4a37f","#fbd7c6"]},"abst":{"cores":["#ece9fb","#d5cff6","#b8aeee","#9a8be4","#7c6bdc","#6250d6","#4a3aa7","#2f2470"],"min":19.011405125406412,"max":32.22490208500953}}};
const NEUTRO = "#e4e5e1", SEM = "#cfd2cc";
const CORTES = [-40, -25, -15, -7, -2, 2, 7, 15, 25, 40];
const fmt = (x, c = 1) => x == null ? "–" : x.toLocaleString("pt-BR", {minimumFractionDigits: c, maximumFractionDigits: c});
const mapa = L.map("mapa", {preferCanvas: true, zoomSnap: 0.25});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {attribution: "© OpenStreetMap", opacity: 0.45, maxZoom: 18}).addTo(mapa);

let camada = D.camadas.find(c => c.id === D.inicial) || D.camadas[0];
let visao = "unidade";

// índices dos campos em cada vetor de valores
const I = {a: 0, b: 1, m: 2, w: 3, wp: 4, comp: 5, abs: 6, bn: 7};
const val = (v, d) => (v && v[d]) || null;

function corMargem(m, esc, fator = 1) {
  if (m == null || isNaN(m)) return SEM;
  const cores = [...esc.b, NEUTRO, ...esc.a];
  let i = 0;
  while (i < CORTES.length && m / fator > CORTES[i]) i++;
  return cores[i];
}
function corSeq(x, esc) {
  if (x == null) return SEM;
  const t = Math.max(0, Math.min(0.999, (x - esc.min) / (esc.max - esc.min)));
  return esc.cores[Math.floor(t * esc.cores.length)];
}
function valor(v) {  // número usado para colorir
  const c = camada;
  if (c.tipo === "margem") { const x = val(v, c.d); return x && x[I.m]; }
  if (c.tipo === "virada") { const x1 = val(v, c.d1), x2 = val(v, c.d2); return x1 && x2 ? x2[I.m] - x1[I.m] : null; }
  if (c.tipo === "vencedor") { const x = val(v, c.d); return x && x[I.w]; }
  if (c.tipo === "abstencao") { const x = val(v, c.d); return x && x[I.abs]; }
}
function cor(v) {
  const c = camada, x = valor(v);
  if (c.tipo === "margem") return corMargem(x, D.escalas[c.esc]);
  if (c.tipo === "virada") return corMargem(x, D.escalas[c.esc], 0.5);
  if (c.tipo === "vencedor") return x == null ? SEM : (c.cores[x] || "#b5b4ae");
  if (c.tipo === "abstencao") return corSeq(x, D.escalas.abst);
}
function linhaDisputa(d, x) {
  const p = D.polos[d];
  let s = `<b>${p[0]}</b>: ${fmt(x[I.a])}%<br><b>${p[1]}</b>: ${fmt(x[I.b])}%`;
  if (d.endsWith("1")) s += `<br>Mais votado: ${D.nomes[d][x[I.w]] || x[I.w]} (${fmt(x[I.wp])}%)`;
  return s + `<br>Comparecimento: ${fmt(x[I.comp], 0)} · abstenção ${fmt(x[I.abs])}%` +
             `<br>Brancos+nulos: ${fmt(x[I.bn])}%`;
}
function info(nome, v) {
  const c = camada;
  let s = `<b style="font-size:13px">${nome}</b><br>`;
  if (!v) return s + "sem dados";
  if (c.tipo === "virada") {
    const x1 = val(v, c.d1), x2 = val(v, c.d2);
    if (!x1 || !x2) return s + "sem dados";
    const dv = x2[I.m] - x1[I.m], p = D.polos[c.d2];
    return s + `Margem 1º turno: ${fmt(x1[I.m])} p.p.<br>Margem 2º turno: ${fmt(x2[I.m])} p.p.` +
      `<br><b>Variação: ${dv > 0 ? "+" : ""}${fmt(dv)} p.p.</b> (a favor de ${dv > 0 ? p[0] : p[1]})`;
  }
  const x = val(v, c.d);
  return s + (x ? linhaDisputa(c.d, x) : "sem dados");
}

// --- camadas geográficas ---
const geo = L.geoJSON(D.geo, {
  style: f => ({fillColor: cor(D.valores.unidade[f.properties.id]), fillOpacity: 0.85,
                color: "#ffffff", weight: D.borda || 0.8}),
  onEachFeature: (f, l) => {
    l.bindTooltip(() => info(f.properties.nome, D.valores.unidade[f.properties.id]), {sticky: true});
    l.on("mouseover", () => l.setStyle({weight: 2.5, color: "#1d1f22"}));
    l.on("mouseout", () => l.setStyle({weight: D.borda || 0.8, color: "#ffffff"}));
  }
});
const contorno = L.geoJSON(D.geo, {style: {fill: false, color: "#8a8985", weight: 0.6}, interactive: false});
const pontos = L.layerGroup(D.pontos.map(p => {
  const [lat, lon, id, nome, onde] = p;
  const v = D.valores.local[id];
  const comp = v ? Math.max(...Object.values(v).map(x => x[I.comp])) : 0;
  const m = L.circleMarker([lat, lon], {radius: Math.max(2.5, Math.sqrt(comp) / D.raio),
    color: "#ffffff", weight: 0.6, fillOpacity: 0.9});
  m._v = v;
  m.bindTooltip(() => info(`${nome}<br><span style="font-weight:400;color:#52514e">${onde}</span>`, m._v),
                {sticky: true});
  return m;
}));

function redesenhar() {
  if (visao === "unidade") {
    geo.setStyle(f => ({fillColor: cor(D.valores.unidade[f.properties.id])}));
  } else {
    pontos.eachLayer(m => m.setStyle({fillColor: cor(m._v)}));
  }
  legenda.update();
}
function trocarVisao(v) {
  visao = v;
  if (v === "unidade") { mapa.removeLayer(pontos); mapa.removeLayer(contorno); geo.addTo(mapa); }
  else { mapa.removeLayer(geo); contorno.addTo(mapa); pontos.addTo(mapa); }
  redesenhar();
}

// --- controles ---
const painel = L.control({position: "topright"});
painel.onAdd = () => {
  const div = L.DomUtil.create("div", "painel");
  let h = "<h4>Disputa</h4>";
  for (const c of D.camadas)
    h += `<label><input type="radio" name="c" value="${c.id}" ${c === camada ? "checked" : ""}> ${c.rotulo}</label>`;
  if (D.pontos.length) {
    h += "<h4>Recorte</h4>";
    h += `<label><input type="radio" name="v" value="unidade" checked> ${D.nome_unidade}</label>`;
    h += `<label><input type="radio" name="v" value="local"> Locais de votação</label>`;
  }
  div.innerHTML = h;
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);
  div.addEventListener("change", e => {
    if (e.target.name === "c") { camada = D.camadas.find(c => c.id === e.target.value); redesenhar(); }
    if (e.target.name === "v") trocarVisao(e.target.value);
  });
  return div;
};
painel.addTo(mapa);

const legenda = L.control({position: "bottomleft"});
legenda.onAdd = () => (legenda._div = L.DomUtil.create("div", "legenda"));
legenda.update = () => {
  const c = camada;
  let h = "";
  if (c.tipo === "margem" || c.tipo === "virada") {
    const e = D.escalas[c.esc], k = c.tipo === "virada" ? 0.5 : 1, p = D.polos[c.d || c.d2];
    h = `<div class="t">${c.tipo === "virada" ? "Variação da margem entre turnos (p.p.)" : "Margem nos votos válidos (p.p.)"}</div>`;
    h += `<div class="barra">${[...e.b, NEUTRO, ...e.a].map(x => `<span style="background:${x}"></span>`).join("")}</div>`;
    h += `<div class="rot"><span>${p[1]} +${40 * k}</span><span>0</span><span>${p[0]} +${40 * k}</span></div>`;
  } else if (c.tipo === "vencedor") {
    h = `<div class="t">Mais votado</div>` + Object.entries(c.legenda)
      .map(([n, nome]) => `<div class="cat"><i style="background:${c.cores[n] || "#b5b4ae"}"></i>${nome}</div>`).join("");
  } else {
    const e = D.escalas.abst;
    h = `<div class="t">Abstenção (%)</div><div class="barra">${e.cores.map(x => `<span style="background:${x}"></span>`).join("")}</div>`;
    h += `<div class="rot"><span>${fmt(e.min, 0)}%</span><span>${fmt(e.max, 0)}%</span></div>`;
  }
  if (visao === "local") h += `<div class="rot" style="margin-top:6px">Círculo ∝ comparecimento</div>`;
  legenda._div.innerHTML = h;
};
legenda.addTo(mapa);

geo.addTo(mapa);
mapa.fitBounds(geo.getBounds(), {padding: [10, 10]});
redesenhar();
</script></body></html>
